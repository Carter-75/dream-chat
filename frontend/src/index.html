<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dream Chat: ask about dreams, lucid dreaming, and the Gateway Process</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A free dream chat with no sign up. Interpret dreams, learn lucid dreaming, and explore sleep paralysis, Mall World, and the Gateway Process, with sources labeled.">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0a0a24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dream Chat">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <script>
    (function() {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'CHECK_IN', project: 'dream-chat' }, '*');
      }
    })();
  </script>
</head>
